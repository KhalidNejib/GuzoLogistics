name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─── Lint ──────────────────────────────────────────────────────────────
      - name: ESLint
        run: pnpm run lint

      # ─── Type Safety ───────────────────────────────────────────────────────
      - name: TypeScript — API (services/api)
        run: pnpm --filter @ethio-logistics/api exec tsc --noEmit

      - name: TypeScript — Mobile (apps/mobile-rider)
        run: pnpm --filter mobile-rider exec tsc --noEmit

      - name: TypeScript — Web Dashboard (apps/web-dashboard)
        run: pnpm --filter web-dashboard exec tsc --noEmit

      # ─── Tests ─────────────────────────────────────────────────────────────
      - name: Vitest — API (services/api)
        run: pnpm --filter @ethio-logistics/api test
